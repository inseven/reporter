name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 14 * * 1'  # 04:00 Monday, HST.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  generate-version-number:
    runs-on: ubuntu-26.04

    outputs:
      version_number: ${{ steps.version.outputs.version_number }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install mise
      uses: jdx/mise-action@v5.0.1
      with:
        cache: false
        version: 2026.9.14
        mise_toml: |
          [tools]
          "pipx:changes-semver" = "6"
          "pipx:inseven-build-tools" = "1"

    - name: Generate version and build numbers
      id: version
      run: |
        VERSION_NUMBER=`changes version`
        BUILD_NUMBER=`build-tools generate-build-number`
        echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  macos-build:
    runs-on: inseven-macos-26

    needs:
    - generate-version-number

    env:
      VERSION_NUMBER: ${{ needs.generate-version-number.outputs.version_number }}
      BUILD_NUMBER: ${{ needs.generate-version-number.outputs.build_number }}

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        lfs: true

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.9.10
        cache: false

    - name: Build, test, and release
      env:
        DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.PERSONAL_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
        DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.PERSONAL_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_BASE64: ${{ secrets.PERSONAL_APPLE_API_KEY_BASE64 }}
        APPLE_API_KEY_ISSUER_ID: ${{ secrets.PERSONAL_APPLE_API_KEY_ISSUER_ID }}
        APPLE_API_KEY_ID: ${{ secrets.PERSONAL_APPLE_API_KEY_ID }}
      run: |
        scripts/build-macos.sh

    - name: Archive the binary
      uses: actions/upload-artifact@v6
      with:
        name: reporter-macos
        path: build/artifacts/*
        if-no-files-found: error

  linux-build:
    strategy:
      matrix:
        include:

        # Ubuntu.

        - name: ubuntu-questing-amd64
          os: ubuntu-24.04
          container: ubuntu:questing
          setup: |
            apt-get update -y
            apt-get install -y build-essential git swiftlang

        - name: ubuntu-questing-arm64
          os: ubuntu-24.04-arm
          container: ubuntu:questing
          setup: |
            apt-get update -y
            apt-get install -y build-essential git swiftlang

        - name: ubuntu-noble-amd64
          os: ubuntu-24.04

        - name: ubuntu-noble-arm64
          os: ubuntu-24.04-arm

        # Debian.

        - name: debian-trixie-amd64
          os: ubuntu-24.04
          container: debian:trixie
          setup: |
            apt-get update -y
            apt-get install -y build-essential git swiftlang

        - name: debian-trixie-arm64
          os: ubuntu-24.04-arm
          container: debian:trixie
          setup: |
            apt-get update -y
            apt-get install -y build-essential git swiftlang

    name: ${{ matrix.name }}-build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    needs:
    - generate-version-number

    env:
      VERSION_NUMBER: ${{ needs.generate-version-number.outputs.version_number }}
      BUILD_NUMBER: ${{ needs.generate-version-number.outputs.build_number }}

    steps:

    - name: Setup container
      if: ${{ matrix.setup != '' }}
      run: ${{ matrix.setup }}

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: scripts/install-linux-dependencies.sh

    - name: Build, test, and release
      run: |
        scripts/build-linux.sh

    - name: Archive the binary
      uses: actions/upload-artifact@v6
      with:
        name: reporter-${{ matrix.name }}
        path: build/artifacts/*
        if-no-files-found: error

  publish-release:
    runs-on: ubuntu-26.04

    needs:
    - generate-version-number
    - macos-build
    - linux-build

    env:
      VERSION_NUMBER: ${{ needs.generate-version-number.outputs.version_number }}
      BUILD_NUMBER: ${{ needs.generate-version-number.outputs.build_number }}

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.9.10
        cache: false

    - name: Install Linux-specific dependencies
      run: scripts/install-linux-dependencies.sh

    - uses: actions/download-artifact@v8
      with:
        pattern: "reporter-*"
        path: artifacts

    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE: ${{ github.ref == 'refs/heads/main' }}

      run: scripts/release.sh

    - name: Archive the binaries
      uses: actions/upload-artifact@v6
      with:
        name: build
        path: build/*
        if-no-files-found: error

  update-releases:
    needs: publish-release
    if: ${{ github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-26.04
    steps:

    - name: Update releases repository
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets._GITHUB_ACCESS_TOKEN }}
        repository: inseven/releases
        event-type: build
